name: fetch
run-name: fetch ${{ inputs.id }}
on:
  workflow_dispatch:
    inputs:
      url:
        description: direct video link (http/https)
        required: true
      id:
        description: video id
        required: true
      name:
        description: title
        required: false
permissions:
  contents: write
concurrency:
  group: fetch-${{ inputs.id }}
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      URL: ${{ inputs.url }}
      VID: ${{ inputs.id }}
      TITLE: ${{ inputs.name }}
    steps:
      - uses: actions/checkout@v5
      - name: download and publish
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$VID" | grep -Eq '^[a-z0-9]+$' || { echo "bad id"; exit 1; }
          case "$URL" in
            https://*|http://*) ;;
            *) echo "direct http(s) links only"; exit 1 ;;
          esac
          TAG="v-$VID"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "already published"; exit 0; fi
          mkdir -p work
          curl -fL --retry 3 --retry-delay 5 --max-time 10000 -o "work/src.bin" "$URL"
          SIZE="$(stat -c %s work/src.bin)"
          if [ "$SIZE" -le 0 ]; then echo "empty download"; exit 1; fi
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq ffmpeg >/dev/null
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 work/src.bin | head -n1 | tr -d '\r' || true)"
          case "$H" in ''|*[!0-9]*) echo "not a video file: use a direct link to the file"; exit 1 ;; esac
          echo "source height: $H"
          QS=""
          for q in 360 720 1080; do
            if [ "$H" -ge "$q" ]; then QS="$QS $q"; fi
          done
          if [ "$H" -ge 2160 ]; then QS="$QS 2160"; fi
          if [ -z "$QS" ]; then QS="$H"; fi
          for q in $QS; do
            out="work/$VID-$q.mp4"
            if [ "$q" = "2160" ]; then
              ffmpeg -nostdin -loglevel error -y -i work/src.bin -c:v copy -c:a aac -b:a 160k -movflags +faststart "$out"
            else
              ffmpeg -nostdin -loglevel error -y -i work/src.bin -vf "scale=-2:$q" -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart "$out"
            fi
            S="$(stat -c %s "$out")"
            if [ "$S" -gt 2147483648 ]; then echo "$q is larger than 2GB (GitHub release limit)"; rm -f "$out"; fi
          done
          rm -f work/src.bin
          ls work/*.mp4 >/dev/null 2>&1 || { echo "no output produced"; exit 1; }
          gh release create "$TAG" work/*.mp4 --title "${TITLE:-$VID}" --notes "filmko video"
